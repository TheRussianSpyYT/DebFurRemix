name: Mirror to Codeberg

on:
  push:
    branches: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git push --mirror https://TheRussianSpyYT:${CODEBERG_TOKEN}@codeberg.org/TheRussianSpyYT/DebFurRemix-Pulled_from_github.git
